name: build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        path: gopath/go.katydid.org.za/parser-go
    - name: Setup Go
      uses: actions/setup-go@v3
      with:
        go-version: 1.24
    - name: Fetch dependencies
      run: |
        cd gopath/go.katydid.org.za/parser-go
        go mod download -x
    - name: env
      run: env && go env && pwd
    - name: tree
      run: tree
    - name: Build
      run: |
        cd gopath/go.katydid.org.za/parser-go
        make build
    - name: Test
      run: |
        cd gopath/go.katydid.org.za/parser-go
        make test
    - name: Test PureGo
      run: |
        cd gopath/go.katydid.org.za/parser-go
        make test-purego
    - name: Checklicencse
      uses: awalterschulze/checklicense@v1.0.6
      with:
        ignores: doc.go tools/tools.go .svg .txt
    - name: Diff
      run: |
        cd gopath/go.katydid.org.za/parser-go
        make diff
